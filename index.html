<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>fortune-japan — Tells your fortune</title>
    <meta name="description" content="Tells your fortune. Accuracy not included.">
    <meta name="theme-color" content="#fdfcf9">
    <meta property="og:title" content="fortune-japan">
    <meta property="og:description" content="Tells your fortune. Accuracy not included.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://uselesssoso.github.io/fortune-japan/">
    <meta property="og:image" content="https://uselesssoso.github.io/fortune-japan/docs/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="fortune-japan. Tells your fortune. Accuracy not included.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="fortune-japan">
    <meta name="twitter:description" content="Tells your fortune. Accuracy not included.">
    <meta name="twitter:image" content="https://uselesssoso.github.io/fortune-japan/docs/og.png">
    <meta name="twitter:image:alt" content="fortune-japan. Tells your fortune. Accuracy not included.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Noto+Serif+JP:wght@400;600&family=Noto+Serif+SC:wght@400;600&display=swap">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page">
      <header class="head">
        <div class="title">
          <svg class="plug" viewBox="4 11 56 36" width="40" height="26" aria-hidden="true" focusable="false">
            <g fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M31.5 15.2c3.9-.4 9.6-.5 13.1.1.9 3.9 1 13.9.2 18.3-3.6.7-9.4.6-13.4.1-.7-5-.6-13.6.1-18.5z"/>
              <path d="M44.9 20.6c4-.2 8.6 0 12.3.3M45 28.6c4.1-.1 8.7 0 12.4.4"/>
              <path d="M31.4 21.3c-2.6.2-4.8.3-6.6.9-.4 1.6-.3 3.6.1 5.2 1.9.5 4.2.6 6.5.6"/>
              <path d="M24.9 24.8C19 25.2 14.3 27.9 12 32.2c-2.6 4.9.4 9.6 5.3 9.2 4.4-.4 4.6-5.6 1-6.4-4.1-.9-8.6 3.4-11.2 9.6"/>
            </g>
          </svg>
          <h1>fortune-japan</h1>
        </div>
        <div class="lang-switch" id="lang-switch" role="radiogroup" aria-label="Language">
          <button type="button" class="lang is-on" data-lang="en" aria-checked="true">EN</button>
          <button type="button" class="lang" data-lang="ja" aria-checked="false">日本語</button>
          <button type="button" class="lang" data-lang="zh" aria-checked="false">中文</button>
        </div>
      </header>

      <p class="tagline">
        <span class="tagline-line">Tells your fortune.</span>
        <span class="tagline-line">Accuracy not included.</span>
      </p>

      <form id="draw-form" class="draw-form">
        <label class="name-field">
          <span class="name-label"><span data-i18n="name">Name</span> <span data-i18n="optional">optional</span></span>
          <input id="name" name="name" maxlength="40" autocomplete="off" spellcheck="false" enterkeyhint="done" placeholder="For a fortune that stays put today" data-i18n-placeholder="namePlaceholder">
        </label>
        <p class="hint" data-i18n="hint">Same name, same day, same answer. Your name stays in the browser.</p>

        <div class="shrine-hit" id="shrine-hit">
          <div class="shrine">
            <div class="shaker" id="shaker">
              <div class="stick" aria-hidden="true"><span id="stick-no"></span></div>
              <svg class="box" viewBox="0 0 154 132" aria-hidden="true" focusable="false">
                <path class="wood" d="M36 50h82v66H36z"/>
                <path class="lid" d="M36 50c0-12 18-20 41-20s41 8 41 20c0 9-18 16-41 16S36 59 36 50z"/>
                <ellipse class="hole" cx="77" cy="48" rx="8" ry="3"/>
                <path class="label" d="M63 72h28v34H63z"/>
                <g class="seal" fill="currentColor" text-anchor="middle">
                  <text x="77" y="86">御</text>
                  <text x="77" y="99">神</text>
                  <text x="77" y="112">籤</text>
                </g>
              </svg>
            </div>
          </div>
        </div>

        <button type="submit" class="primary" id="draw">Draw a fortune</button>
      </form>

      <article id="slip" class="slip" hidden aria-live="polite">
        <p class="slip-meta">
          <span id="slip-number">No. 1</span>
          <span id="slip-when">Good until midnight.</span>
        </p>
        <div class="rank-block">
          <p class="rank-jp" id="rank-jp" lang="ja">大吉</p>
          <p class="rank-reading" id="rank-reading">daikichi</p>
          <p class="rank-en" id="rank-en">Great blessing</p>
        </div>
        <p class="slip-for" id="slip-for"></p>
        <p class="summary" id="summary"></p>
        <dl class="categories" id="categories"></dl>
        <div class="charms">
          <div>
            <p class="charm-label" data-i18n="luckyColor">Lucky color</p>
            <p class="charm-value">
              <i id="color-swatch" class="swatch" aria-hidden="true"></i>
              <span id="color-name"></span>
              <span id="color-jp" class="charm-jp" lang="ja"></span>
            </p>
          </div>
          <div>
            <p class="charm-label" data-i18n="luckyItem">Lucky item</p>
            <p class="charm-value" id="item-name"></p>
          </div>
        </div>
        <p class="note" id="repeat-note" hidden></p>
        <div class="actions">
          <button type="button" class="ghost" id="copy">Copy fortune</button>
          <a class="ghost" id="share-x" href="https://x.com/intent/post" target="_blank" rel="noopener noreferrer">Share on X</a>
          <button type="button" class="ghost" id="share" hidden>Share</button>
          <p id="copy-status" class="copy-status" role="status"></p>
        </div>
      </article>

      <noscript>
        <p class="hint">This fortune needs JavaScript. There is still no server.</p>
        <p class="hint" lang="ja">この籤には JavaScript が要る。サーバーは、ない。</p>
        <p class="hint" lang="zh-Hans">这张签需要 JavaScript。服务器并不存在。</p>
      </noscript>

      <footer class="site-footer">
        <a href="https://github.com/uselesssoso">@uselesssoso</a>
      </footer>
    </main>
    <script src="fortunes.js"></script>
    <script src="app.js"></script>
  </body>
</html>
