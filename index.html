  <head>

    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <p class="watermark" lang="ja" aria-hidden="true">籤</p>
    <main class="page">
      <header class="masthead">
        <svg class="torii" viewBox="0 0 64 48" aria-hidden="true">
          <path d="M8 16h48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M12 10c8 7 32 7 40 0" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <path d="M18 16v22M46 16v22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <path d="M16 26h32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
        <p class="wordmark"><svg class="plug" viewBox="4 11 56 36" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M31.5 15.2c3.9-.4 9.6-.5 13.1.1.9 3.9 1 13.9.2 18.3-3.6.7-9.4.6-13.4.1-.7-5-.6-13.6.1-18.5z"/><path d="M44.9 20.6c4-.2 8.6 0 12.3.3M45 28.6c4.1-.1 8.7 0 12.4.4"/><path d="M31.4 21.3c-2.6.2-4.8.3-6.6.9-.4 1.6-.3 3.6.1 5.2 1.9.5 4.2.6 6.5.6"/><path d="M24.9 24.8C19 25.2 14.3 27.9 12 32.2c-2.6 4.9.4 9.6 5.3 9.2 4.4-.4 4.6-5.6 1-6.4-4.1-.9-8.6 3.4-11.2 9.6"/></g></svg>fortune-japan</p>
        <h1 lang="ja">おみくじ</h1>
        <p class="tagline">
          <span class="tagline-line">Tells your fortune.</span>
          <span class="tagline-line">Accuracy not included.</span>
        </p>
        <div class="lang-switch" id="lang-switch" role="radiogroup" aria-label="Language">
          <button type="button" class="lang is-on" data-lang="en" aria-checked="true">EN</button>
          <button type="button" class="lang" data-lang="ja" aria-checked="false">日本語</button>
          <button type="button" class="lang" data-lang="zh" aria-checked="false">中文</button>
        </div>
      </header>

      <form id="draw-form" class="draw-form">
        <label class="name-field">
          <span class="name-label"><span data-i18n="name">Name</span> <span data-i18n="optional">optional</span></span>
          <input id="name" name="name" maxlength="40" autocomplete="off" spellcheck="false" enterkeyhint="done" placeholder="For a fortune that stays put today" data-i18n-placeholder="namePlaceholder">
        </label>
        <p class="hint" data-i18n="hint">Same name, same day, same answer. Your name stays in the browser.</p>

        <div class="shrine-hit" id="shrine-hit">
          <div class="shrine">
            <div class="shaker" id="shaker">
              <div class="stick" aria-hidden="true"><span id="stick-no"></span></div>
              <svg class="box" viewBox="0 0 240 280" aria-hidden="true">
                <defs>
                  <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0" stop-color="#6a3b26"/>
                    <stop offset="0.28" stop-color="#a56b43"/>
                    <stop offset="0.48" stop-color="#c4895c"/>
                    <stop offset="0.7" stop-color="#8d5434"/>
                    <stop offset="1" stop-color="#59321f"/>
                  </linearGradient>
                  <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#e0b488"/>
                    <stop offset="1" stop-color="#8d5536"/>
                  </linearGradient>
                </defs>
                <ellipse cx="120" cy="252" rx="78" ry="12" fill="rgba(55,30,16,0.16)"/>
                <path d="M58 108h124v112a10 10 0 0 1-10 10H68a10 10 0 0 1-10-10V108z" fill="url(#wood)" stroke="#4a2c1c" stroke-width="2"/>
                <ellipse cx="120" cy="108" rx="64" ry="20" fill="url(#lid)" stroke="#4a2c1c" stroke-width="2"/>
                <ellipse cx="120" cy="104" rx="46" ry="12" fill="#9a6240" opacity="0.35"/>
                <ellipse cx="120" cy="106" rx="18" ry="6.5" fill="#24140d"/>
                <ellipse cx="120" cy="104.5" rx="11" ry="3.5" fill="#4a2c1e"/>
                <g fill="none" stroke="#3a2014" stroke-opacity="0.22" stroke-width="1.4">
                  <path d="M70 142h100"/>
                  <path d="M66 168h108"/>
                  <path d="M70 196h100"/>
                </g>
                <rect x="96" y="156" width="48" height="78" rx="2" fill="#f7f1e4" stroke="#9e2a22" stroke-width="1.6"/>
                <g fill="#9e2a22" font-family="Shippori Mincho, serif" font-size="16" text-anchor="middle">
                  <text x="120" y="178">御</text>
                  <text x="120" y="198">神</text>
                  <text x="120" y="218">籤</text>
                </g>
              </svg>
            </div>
          </div>
        </div>

        <button type="submit" class="draw-button" id="draw">Draw a fortune</button>
      </form>

      <article id="slip" class="slip" hidden aria-live="polite">
        <p class="slip-meta">
          <span id="slip-number">No. 1</span>
          <span id="slip-when">Good until midnight.</span>
        </p>
        <div class="rank-block">
          <p class="rank-jp" id="rank-jp" lang="ja">大吉</p>
          <p class="rank-reading" id="rank-reading">daikichi</p>
          <p class="rank-en" id="rank-en">Great blessing</p>
        </div>
        <p class="slip-for" id="slip-for"></p>
        <p class="summary" id="summary"></p>
        <dl class="categories" id="categories"></dl>
        <div class="charms">
          <div>
            <p class="charm-label" data-i18n="luckyColor">Lucky color</p>
            <p class="charm-value">
              <i id="color-swatch" class="swatch" aria-hidden="true"></i>
              <span id="color-name"></span>
              <span id="color-jp" class="charm-jp" lang="ja"></span>
            </p>
          </div>
          <div>
            <p class="charm-label" data-i18n="luckyItem">Lucky item</p>
            <p class="charm-value" id="item-name"></p>
          </div>
        </div>
        <p class="note" id="repeat-note" hidden></p>
        <div class="actions">
          <button type="button" class="ghost" id="copy">Copy fortune</button>
          <a class="ghost" id="share-x" href="https://x.com/intent/post" target="_blank" rel="noopener noreferrer">Share on X</a>
          <button type="button" class="ghost" id="share" hidden>Share</button>
        </div>
        <p id="copy-status" class="copy-status" role="status"></p>
      </article>

      <noscript>
        <p class="hint">This fortune needs JavaScript. There is still no server.</p>
        <p class="hint" lang="ja">この籤には JavaScript が要る。サーバーは、ない。</p>
        <p class="hint" lang="zh-Hans">这张签需要 JavaScript。服务器并不存在。</p>
      </noscript>

      <footer class="site-footer">
        <p><span data-i18n="signed">Signed</span> <a href="https://github.com/uselesssoso">@uselesssoso</a></p>
      </footer>
    </main>
    <script src="fortunes.js"></script>
    <script src="app.js"></script>
  </body>
</html>
